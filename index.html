<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are an idiot! (dot org)</title>
    
    <meta name="description" content="This is the orgional and the best flash video on the 'net. Once found on www.youdontknowwhoiam.org, not found where it belong, right here on...">
    <meta name="author" content="youdontknowwhoiam">
    
    <link rel="icon" type="image/jpg" href="thegeekpug.jpg">
    
    <style>
        /* Reseteo completo del espacio del navegador */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        /* Fuerza un contenedor grande que choca arriba y abajo obligatoriamente */
        .swf-container {
            width: 100%;
            height: 100vh; /* Alto total de la ventana del navegador */
            max-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Control total sobre las dimensiones del objeto Flash */
        object, embed {
            width: auto;
            height: 100% !important; /* Prioridad absoluta para chocar con los bordes */
            aspect-ratio: 4 / 3; /* Proporción nativa de la animación de 2013 */
            display: block;
        }
    </style>
</head>
<body>

    <div class="swf-container">
        <!-- Uso de objeto con parámetros nativos de Flash para forzar el escalado -->
        <object data="youare.swf" type="application/x-shockwave-flash">
            <param name="movie" value="youare.swf">
            <param name="allowScriptAccess" value="never">
            <!-- Este parámetro obliga al contenido interno del SWF a estirarse al tamaño asignado -->
            <param name="scale" value="exactfit">
            <param name="wmode" value="opaque">
            
            <!-- Alternativa embed por si usas un navegador antiguo o extensión específica -->
            <embed src="youare.swf" 
                   type="application/x-shockwave-flash" 
                   allowscriptaccess="never" 
                   scale="exactfit" 
                   width="100%" 
                   height="100%">
        </object>
    </div>

</body>
</html>
